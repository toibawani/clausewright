[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausewright"
version = "0.1.0"
description = "Structure-aware retrieval and grounded question answering over contracts."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pymupdf",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "anthropic",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_cuad: requires the fetched CUAD corpus under data/raw (skipped when absent)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
mypy_path = "src"
warn_unused_ignores = false
