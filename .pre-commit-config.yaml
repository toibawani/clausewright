default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src]

      - id: commit-safety
        name: secret and data guard
        entry: .venv/bin/python scripts/check_commit_safety.py
        language: system
        pass_filenames: true
