- id: adv-xref-01
  type: cross_reference
  status: draft
  contract_context: Section 14.2 states liability is capped at 12 months fees, subject to Section 8.4. Section 8.4 states
    indemnification obligations for IP infringement are uncapped.
  question: What is the liability cap for IP infringement claims?
  expected_behavior: Resolve cross-referenced section and synthesize answer with citations to both sections.
  gold_answer: Liability for IP infringement claims is uncapped pursuant to Section 8.4, which carves out IP indemnity from
    the Section 14.2 general cap.
  gold_citations:
  - Section 14.2
  - Section 8.4
  should_abstain: false
  notes: Requires linking general cap in 14.2 to specific carve-out in 8.4.
